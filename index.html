<!doctype html>
<html lang="en">
  <head>
    <title>Calculator</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="box">
      <div class="buttons">
        <textarea id="display"></textarea>
        <div class="r1">
          <button data-value="AC">
            <div class="a">
              <h1>AC</h1>
            </div>
          </button>

          <button data-value="DEL">
            <div class="b"><h1>DEL</h1></div>
          </button>
          <button data-value="%">
            <div class="c"><h1>%</h1></div>
          </button>
          <button data-value="/">
            <div class="d"><h1>/</h1></div>
          </button>
        </div>
        <div class="r2">
          <button data-value="7">
            <div class="e"><h1>7</h1></div>
          </button>
          <button data-value="8">
            <div class="f"><h1>8</h1></div>
          </button>
          <button data-value="9">
            <div class="g"><h1>9</h1></div>
          </button>
          <button data-value="*">
            <div class="h"><h1>*</h1></div>
          </button>
        </div>
        <div class="r3">
          <button data-value="4">
            <div class="i"><h1>4</h1></div>
          </button>
          <button data-value="5">
            <div class="j"><h1>5</h1></div>
          </button>
          <button data-value="6">
            <div class="k"><h1>6</h1></div>
          </button>
          <button data-value="-">
            <div class="l"><h1>-</h1></div>
          </button>
        </div>
        <div class="r4">
          <button data-value="1">
            <div class="m"><h1>1</h1></div>
          </button>
          <button data-value="2">
            <div class="n"><h1>2</h1></div>
          </button>
          <button data-value="3">
            <div class="o"><h1>3</h1></div>
          </button>
          <button data-value="+">
            <div class="add-button"><h1>+</h1></div>
          </button>
        </div>
        <div class="r5">
          <button data-value="0">
            <div class="q"><h1>0</h1></div>
          </button>
          <button data-value="00">
            <div class="r"><h1>00</h1></div>
          </button>
          <button data-value=".">
            <div class="s"><h1>.</h1></div>
          </button>
          <button data-value="=">
            <div class="t"><h1>=</h1></div>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
